# Alembic configuration for the ai_tag_description_generation module.
# The sqlalchemy.url is intentionally left empty here because env.py
# overrides it at runtime from the DATABASE_URL_SYNC environment variable.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/../..
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
