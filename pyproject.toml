[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-ingestion"
version = "0.1.0"
description = "Production-grade multimodal data ingestion module for AI processing pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",

    # --- Authentication ---
    "PyJWT[crypto]>=2.8.0,<3.0",
    "bcrypt>=4.1.0,<5.0",

    # --- AWS / S3 ---
    "boto3>=1.34.0,<2.0",
    "botocore>=1.34.0,<2.0",

    # --- SMB (NAS) ---
    "smbprotocol>=1.13.0,<2.0",

    # --- HashiCorp Vault ---
    "hvac>=2.1.0,<3.0",

    # --- Kafka ---
    "confluent-kafka>=2.4.0,<3.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.0,<2.0",
    "psycopg2-binary>=2.9.9,<3.0",

    # --- File Validation ---
    "python-magic>=0.4.27,<1.0",
    "python-magic-bin>=0.4.14,<1.0; sys_platform == 'win32'",

    # --- Metadata Extraction ---
    "tika>=2.6.0,<3.0",

    # --- Data Validation ---
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",

    # --- UUIDv7 ---
    "uuid-utils>=0.9.0,<1.0",

    # --- Monitoring ---
    "prometheus-client>=0.20.0,<1.0",

    # --- Logging ---
    "python-json-logger>=2.0.0,<3.0",

    # --- Resilience ---
    "tenacity>=8.3.0,<10.0",
    "pybreaker>=1.2.0,<2.0",

    # --- HTTP Client (for Tika, health checks) ---
    "httpx>=0.27.0,<1.0",

    # --- Multipart form support for FastAPI ---
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "moto[s3]>=5.0.0,<6.0",
    "testcontainers>=4.4.0,<5.0",
    "ruff>=0.4.0,<1.0",
    "mypy>=1.10.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring external services (Docker Compose stack)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
