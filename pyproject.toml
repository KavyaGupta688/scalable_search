[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smsprsm-2026"
version = "0.1.0"
description = "Multimodal file search and ingestion platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    "python-jose[cryptography]>=3.3,<4",
    "bcrypt>=4,<5",
    "email-validator>=2,<3",
    "redis>=5,<6",
    "celery>=5.4,<6",
    # --- Observability ---
    "prometheus-fastapi-instrumentator>=6.1.0,<7.0",
    "prometheus-client>=0.20.0,<1.0",

    # --- Web Framework ---
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "python-multipart>=0.0.9,<1.0",

    # --- Database & Storage ---
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "alembic>=1.13.0,<2.0",

    # --- Data Validation ---
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",

    # --- Resilience & HTTP ---
    "httpx>=0.27.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
search = [
    # Production Search Service #2 (services/search/backend)
    "qdrant-client>=1.8.0,<2.0",
    "aiosqlite>=0.20.0,<1.0",
    "asyncpg>=0.29.0,<1.0",
    "redis>=5.0.3,<6.0",
    "numpy>=1.26.0,<3.0",
]

[project.scripts]
smsprsm-api = "server:run"

[tool.setuptools.packages.find]
include = ["modules*", "src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "modules"]
