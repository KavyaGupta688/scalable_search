global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/retention-alerts.yml
scrape_configs:
  - job_name: 'ingestion-api'
    static_configs:
      - targets: ['ingestion-api:8000']
  - job_name: 'ingestion-worker'
    dns_sd_configs:
      - names: ['ingestion-worker']
        type: A
        port: 9100
  - job_name: 'ingestion-retention'
    static_configs:
      - targets: ['retention-reconciler:9200']
