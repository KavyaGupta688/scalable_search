services:
  kafka:
    ports:
      - "9092:9092"

  vault:
    ports:
      - "8200:8200"

  elasticsearch:
    ports:
      - "9200:9200"

  logstash:
    ports:
      - "5044:5044"

  kibana:
    ports:
      - "5601:5601"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3000:3000"

  ingestion-api:
    ports:
      - "8000:8000"
    volumes:
      - ../../src:/app/src:ro
      - ../../scripts:/app/scripts:ro
    environment:
      - JWT_DEV_TOKEN_ENABLED=true
      - APP_ENVIRONMENT=development
      - APP_DEBUG=false

  ingestion-worker:
    volumes:
      - ../../src:/app/src:ro
      - ../../scripts:/app/scripts:ro
    environment:
      - APP_ENVIRONMENT=development
      - APP_DEBUG=false

  retention-reconciler:
    volumes:
      - ../../src:/app/src:ro
      - ../../scripts:/app/scripts:ro
    environment:
      - APP_ENVIRONMENT=development
      - APP_DEBUG=false

  ingestion-enumerator:
    volumes:
      - ../../src:/app/src:ro
      - ../../scripts:/app/scripts:ro
    environment:
      - APP_ENVIRONMENT=development
      - APP_DEBUG=false
