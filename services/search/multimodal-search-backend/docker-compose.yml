version: "3.9"

# Local production-like stack: real PostgreSQL, real Qdrant server, real Redis.
# Brings up the same three dependencies the production guards in
# app/db/postgres.py and app/db/qdrant.py require - use this (instead of the
# SQLite + embedded-Qdrant dev defaults in .env) to actually exercise the
# full-text search, HNSW/payload-index, and connection-pooling code paths.
#
# Usage:
#   docker compose up -d
#   copy .env to .env and point DATABASE_URL / QDRANT_HOST / REDIS_HOST at
#   these services (see the "Full production-like setup" section in README.md)

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multimodal_search
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  qdrant_data:
  redis_data:
