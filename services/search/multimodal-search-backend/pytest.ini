[pytest]
asyncio_mode = strict
; The app's SQLAlchemy async engine (app/db/postgres.py) is a module-level
; singleton created once at import time and, against a real network driver
; (asyncpg), its pooled connections are bound to whichever event loop
; existed when they were opened. pytest-asyncio's default is a fresh event
; loop per test function, which orphans those connections between tests and
; surfaces as "Event loop is closed" / AttributeError on later tests -
; harmless against SQLite (no real async socket I/O) but real against
; PostgreSQL. Sharing one event loop for the whole session keeps the engine
; usable across every test.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
