version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: multimodal-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: multimodal_search
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: multimodal-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: multimodal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./multimodal-search-backend
      dockerfile: Dockerfile
    container_name: multimodal-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/multimodal_search
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_EMBEDDED: "False"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_FALLBACK_MEMORY: "False"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
