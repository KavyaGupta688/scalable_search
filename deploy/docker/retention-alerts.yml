groups:
  - name: ingestion-licence-expiry
    rules:
      - alert: LicenceExpiryReconciliationFailing
        expr: increase(ingestion_retention_reconciliation_runs_total{outcome="failure"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Licence-expiry reconciliation is failing
      - alert: LicenceExpiryBacklog
        expr: ingestion_retention_expired_pending > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Expired licence records have not been reconciled
      - alert: LicenceExpiryReconcilerStale
        expr: time() - ingestion_retention_last_success_timestamp_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Licence-expiry reconciler has not completed recently
