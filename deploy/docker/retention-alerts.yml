groups:
  - name: ingestion-retention
    rules:
      - alert: IngestionRetentionLifecycleConfigurationFailed
        expr: increase(ingestion_retention_lifecycle_apply_total{outcome="failure"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: MinIO retention lifecycle configuration failed
      - alert: IngestionRetentionReconciliationFailed
        expr: increase(ingestion_retention_reconciliation_runs_total{outcome="failure"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Licensed-content retention reconciliation failed
      - alert: IngestionExpiredObjectsPending
        expr: ingestion_retention_expired_pending > 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: Expired objects remain without confirmed deletion
      - alert: IngestionObjectMissingBeforeExpiry
        expr: ingestion_retention_active_missing > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: MinIO content disappeared before its licensed expiry
      - alert: IngestionRetentionReconcilerStale
        expr: (time() - ingestion_retention_last_success_timestamp_seconds > 1800) and ingestion_retention_enforcement_enabled == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Retention reconciler has not completed successfully for 30 minutes
      - alert: MinIOILMExpiryBacklog
        expr: minio_ilm_expiry_missed_tasks > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: MinIO lifecycle scanner is missing expiry work
