  ingestion-outbox: {<<: *checkout}
  search: {<<: *checkout}
  search-outbox: {<<: *checkout}
  ai: {<<: *checkout}
  ai-worker: {<<: *checkout}
  ai-consumer: {<<: *checkout}
  indexer: {<<: *checkout}
  download: {<<: *checkout}
  download-worker: {<<: *checkout}
  download-outbox: {<<: *checkout}
  vault-init: {<<: *checkout}
