global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: platform
    static_configs: [{targets: ['monitoring:8000']}]
  - job_name: gateway
    static_configs: [{targets: ['gateway:9101']}]
  - job_name: ingestion-api
    static_configs: [{targets: ['ingestion:8000']}]
  - job_name: ingestion-worker
    static_configs: [{targets: ['ingestion-worker:9100']}]
  - job_name: qdrant
    static_configs: [{targets: ['qdrant:6333']}]
