; Transaction pooling for the Search service (deploy/integration/search-scale.yml).
[databases]
platform = host=postgres port=5432 dbname=platform

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 40
reserve_pool_size = 10
server_reset_query =
; Search sets search_path as a startup parameter (modules/shared/integration.connection_args).
; PgBouncer 1.20+ keeps it per client instead of rejecting the connection.
track_extra_parameters = search_path
ignore_startup_parameters = extra_float_digits
; asyncpg prepared statements are disabled by DB_STATEMENT_CACHE_SIZE=0; this also lets
; PgBouncer track protocol-level prepared statements from other clients.
max_prepared_statements = 200
